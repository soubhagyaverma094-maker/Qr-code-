<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Menu — Scan & Order</title>
<style>
  :root{
    --bg:#faf7f2;--card:#fff;--ink:#2a2320;--muted:#8a7f76;
    --accent:#e8622c;--gold:#d4a537;--green:#25D366;--line:#efe8df;
    --shadow:0 8px 30px rgba(80,50,30,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  img{display:block;}
  .app{max-width:480px;margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  .m-head{background:var(--card);padding:18px 18px 14px;border-bottom:1px solid var(--line);position:relative;}
  .m-head .rname{font-size:22px;font-weight:800;letter-spacing:-.3px;}
  .m-head .rsub{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .m-head .tbl{position:absolute;top:18px;right:18px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;}
  .cats{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .cats::-webkit-scrollbar{display:none;}
  .cat{white-space:nowrap;font-size:13px;font-weight:600;color:var(--muted);padding:8px 16px;border-radius:20px;background:var(--bg);cursor:pointer;border:1px solid var(--line);}
  .cat.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .items{flex:1;padding:14px;display:flex;flex-direction:column;gap:13px;}
  .catlabel{font-size:16px;font-weight:800;margin:6px 2px 0;}
  .item{background:var(--card);border-radius:16px;overflow:hidden;display:flex;gap:12px;box-shadow:var(--shadow);align-items:stretch;}
  .item .pic{width:96px;height:96px;flex-shrink:0;object-fit:cover;background:linear-gradient(135deg,#fff2e8,#ffe0cc);display:flex;align-items:center;justify-content:center;font-size:34px;}
  .item .info{flex:1;min-width:0;padding:11px 12px 11px 0;display:flex;flex-direction:column;}
  .item .iname{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .veg{width:14px;height:14px;border:1.5px solid #3a9d3a;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .veg::after{content:"";width:7px;height:7px;background:#3a9d3a;border-radius:50%;}
  .nonveg{border-color:#c0392b;}.nonveg::after{background:#c0392b;}
  .item .idesc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35;flex:1;}
  .item .prow{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .item .price{font-size:15px;font-weight:800;}
  .add{background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:700;padding:7px 16px;border-radius:20px;cursor:pointer;}
  .add:active{transform:scale(.92);}
  .qty{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:20px;padding:5px 8px;}
  .qty button{width:24px;height:24px;border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;font-size:16px;font-weight:700;cursor:pointer;line-height:1;}
  .qty span{color:#fff;font-size:14px;font-weight:700;min-width:14px;text-align:center;}
  .cartbar{position:sticky;bottom:0;background:var(--green);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:30;}
  .cartbar.show{transform:translateY(0);}
  .cartbar .citems{color:#fff;font-size:11.5px;opacity:.9;}
  .cartbar .ctotal{color:#fff;font-size:16px;font-weight:800;}
  .cartbar .cgo{background:#fff;color:#128C7E;font-weight:800;font-size:13.5px;padding:9px 18px;border-radius:22px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:none;align-items:flex-end;justify-content:center;}
  .modal.open{display:flex;}
  .sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:up .3s ease;}
  @keyframes up{from{transform:translateY(100%);}to{transform:none;}}
  .sheet .sh{background:var(--card);padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;border-radius:22px 22px 0 0;}
  .sheet .sh .x{font-size:24px;cursor:pointer;line-height:1;}
  .sheet .sh .t{font-size:17px;font-weight:800;}
  .clist{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .crow{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
  .crow .cq{background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:700;color:var(--accent);padding:3px 8px;}
  .crow .cn{flex:1;font-size:13.5px;font-weight:600;}
  .crow .cp{font-size:13.5px;font-weight:700;}
  .crow .cx{color:var(--muted);font-size:18px;cursor:pointer;padding-left:6px;}
  .cempty{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;line-height:1.6;}
  .tblinput{margin:4px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
  .tblinput label{font-size:13px;font-weight:600;color:var(--muted);}
  .tblinput input{flex:1;border:none;outline:none;font-size:14px;font-weight:700;color:var(--ink);}
  .summary{background:var(--card);border-top:1px solid var(--line);padding:14px 18px;}
  .srow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .srow.tot{font-size:16px;font-weight:800;color:var(--ink);margin:8px 0 14px;}
  .place{width:100%;background:var(--green);color:#fff;border:none;padding:15px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 20px rgba(37,211,102,.35);}
  .place:disabled{opacity:.4;box-shadow:none;}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}

  /* ---- background video ---- */
  #bgvid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-2;}
  #bgveil{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,12,8,.45),rgba(20,12,8,.58));}
  body{background:transparent;}
  .app{background:transparent;}
  .m-head{background:rgba(255,255,255,.80);backdrop-filter:blur(6px);}
  .cats{background:rgba(255,255,255,.70);backdrop-filter:blur(6px);}
  .item{background:rgba(255,255,255,.90);backdrop-filter:blur(3px);}
  .catlabel{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);}

</style>
</head>

document.getElementById('rname').textContent=RESTAURANT;
const cart={};
let activeCat=Object.keys(MENU)[0];
const $=id=>document.getElementById(id);
const cats=$('cats'),items=$('items');
function renderCats(){
  cats.innerHTML='';
  Object.keys(MENU).forEach(c=>{
    const b=document.createElement('div');b.className='cat'+(c===activeCat?' on':'');
    b.textContent=c;b.onclick=()=>{activeCat=c;renderCats();renderItems();window.scrollTo({top:0,behavior:'smooth'});};
    cats.appendChild(b);
  });
}
function imgTag(it){
  return '<img class="pic" src="'+it.img+'" alt="'+it.n+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'pic\',textContent:\''+it.e+'\'}))">';
}
function renderItems(){
  items.innerHTML='<div class="catlabel">'+activeCat+'</div>';
  MENU[activeCat].forEach(it=>{
    const inCart=cart[it.n];
    const el=document.createElement('div');el.className='item';
    el.innerHTML=imgTag(it)+
      '<div class="info">'+
        '<div class="iname"><span class="veg '+(it.v?'':'nonveg')+'"></span>'+it.n+'</div>'+
        '<div class="idesc">'+it.d+'</div>'+
        '<div class="prow"><div class="price">\u20b9'+it.p+'</div><div class="ctrl"></div></div>'+
      '</div>';
    const ctrl=el.querySelector('.ctrl');
    if(inCart){
      const q=document.createElement('div');q.className='qty';
      q.innerHTML='<button>\u2212</button><span>'+inCart.qty+'</span><button>+</button>';
      q.children[0].onclick=()=>chg(it,-1);q.children[2].onclick=()=>chg(it,1);
      ctrl.appendChild(q);
    }else{
      const a=document.createElement('button');a.className='add';a.textContent='ADD +';
      a.onclick=()=>chg(it,1);ctrl.appendChild(a);
    }
    items.appendChild(el);
  });
}
function chg(it,d){
  const cur=cart[it.n]?cart[it.n].qty:0;const nq=cur+d;
  if(nq<=0)delete cart[it.n];else cart[it.n]={item:it,qty:nq};
  renderItems();updateBar();if($('cartModal').classList.contains('open'))renderCart();
}
function totals(){let n=0,s=0;Object.values(cart).forEach(c=>{n+=c.qty;s+=c.qty*c.item.p;});return{n,s};}
function updateBar(){const t=totals();$('cartItems').textContent=t.n+' item'+(t.n!==1?'s':'');$('cartTotal').textContent=t.s;$('cartbar').classList.toggle('show',t.n>0);}
$('cartbar').onclick=()=>{renderCart();$('cartModal').classList.add('open');};
$('closeCart').onclick=()=>$('cartModal').classList.remove('open');
$('cartModal').onclick=e=>{if(e.target===$('cartModal'))$('cartModal').classList.remove('open');};
function renderCart(){
  const vals=Object.values(cart);const t=totals();const tax=Math.round(t.s*0.05);
  const cl=$('clist');cl.innerHTML='';
  if(!vals.length)cl.innerHTML='<div class="cempty">Cart khaali hai \ud83c\udf7d\ufe0f<br>Menu se items add karein</div>';
  vals.forEach(c=>{
    const r=document.createElement('div');r.className='crow';
    r.innerHTML='<div class="cq">'+c.qty+'\u00d7</div><div class="cn">'+c.item.n+'</div><div class="cp">\u20b9'+(c.qty*c.item.p)+'</div><div class="cx">\u00d7</div>';
    r.querySelector('.cx').onclick=()=>{delete cart[c.item.n];renderCart();updateBar();};
    cl.appendChild(r);
  });
  $('sumItems').textContent=t.s;$('sumTax').textContent=tax;$('sumTotal').textContent=t.s+tax;
  $('placeBtn').disabled=!vals.length;
}
$('placeBtn').onclick=()=>{
  const vals=Object.values(cart);const t=totals();const tax=Math.round(t.s*0.05);
  const table=$('tableNo').value.trim()||'\u2014';
  let msg='\ud83c\udf7d\ufe0f *NEW ORDER \u2014 '+RESTAURANT+'*\n';
  msg+='Table: *'+table+'*\n\n';
  vals.forEach(c=>{msg+=c.qty+'\u00d7 '+c.item.n+' \u2014 \u20b9'+(c.qty*c.item.p)+'\n';});
  msg+='\nSubtotal: \u20b9'+t.s+'\nTax (5%): \u20b9'+tax+'\n*Total: \u20b9'+(t.s+tax)+'*';
  window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(msg),'_blank');
};
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600);}
renderCats();renderItems();updateBar();
</script>
</body>
</html>
